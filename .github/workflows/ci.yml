name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: calculator-server
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn asteval pytest httpx

      - name: Run tests
        working-directory: calculator-server
        run: pytest -v